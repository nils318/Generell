<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="2048" height="2048"></canvas>
<script src="lib.js"></script>
<script src="quix.js"></script>
<script>
// Profile picture: circle-safe bust of Quix. ?bg=purple|teal
const bg = new URLSearchParams(location.search).get('bg') || 'purple';
const c = document.getElementById('c'), ctx = c.getContext('2d');
ctx.scale(2048 / 1080, 2048 / 1080);
const S = 1080;
let g = ctx.createRadialGradient(540, 470, 40, 540, 540, 780);
if (bg === 'teal') { g.addColorStop(0, '#7FF2E0'); g.addColorStop(0.5, '#17B8A6'); g.addColorStop(1, '#064F5C'); }
else { g.addColorStop(0, '#8A6CFF'); g.addColorStop(0.5, '#4A28C8'); g.addColorStop(1, '#170845'); }
ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
burstLines(ctx, 540, 380, 0.3, bg === 'teal' ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.07)', 22, 60, 1300);
// halo behind the antenna
const tipY = 210;
g = ctx.createRadialGradient(560, tipY, 10, 560, tipY, 420);
g.addColorStop(0, 'rgba(255,212,59,0.32)'); g.addColorStop(1, 'rgba(255,212,59,0)');
ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
// tiny stars
for (let i = 0; i < 26; i++) {
  const a = hash(i) * 6.283, r = 360 + hash(i + 3) * 150, x = 540 + Math.cos(a) * r, y = 540 + Math.sin(a) * r * 0.95;
  sparkle(ctx, x, y, 6 + hash(i + 7) * 12, 0.7, '#FFF6C2');
}
const s = 2.3;
QUIX.drawQuix(ctx, { x: 540, y: 98 + 545 * s, s, t: 0.35, expr: 'smug', pose: { L: [-150, -60, -40, 'fist', null], R: [150, -60, 40, 'fist', null] },
  glow: 0.3, look: [0.12, 0.08], mouth: 0, antAngle: 0.04, shadow: false, wind: 0.4 });
sparkle(ctx, 455, 112, 34, 1); sparkle(ctx, 700, 150, 18, 0.9); sparkle(ctx, 380, 260, 14, 0.8);
// soft vignette so the circle crop feels finished
g = ctx.createRadialGradient(540, 540, 380, 540, 540, 780);
g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, bg === 'teal' ? 'rgba(0,30,40,0.4)' : 'rgba(5,0,25,0.45)');
ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
document.title = 'done';
</script></body></html>
